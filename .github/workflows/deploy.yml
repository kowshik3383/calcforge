name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Build Pages output
        run: npm run build
        env:
          ADSENSE_TOOL_SLOT: ${{ vars.ADSENSE_TOOL_SLOT }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          NEWSLETTER_SIGNUP_URL: ${{ vars.NEWSLETTER_SIGNUP_URL }}

      - name: Verify exported URLs and metadata
        run: node scripts/test-export.mjs
        env:
          ADSENSE_TOOL_SLOT: ${{ vars.ADSENSE_TOOL_SLOT }}

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4.166.0 pages deploy out --project-name=measureforge --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
