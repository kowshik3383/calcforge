name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build Pages output
        run: node static-site/build.mjs
        env:
          SITE_URL: ${{ vars.CLOUDFLARE_SITE_URL || 'https://calcforge.pages.dev' }}

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4.164.0 pages deploy static-site/dist --project-name=calcforge --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
