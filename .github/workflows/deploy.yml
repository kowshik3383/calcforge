name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      create_project:
        description: Create the Pages project before deploying
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build Pages output
        run: node static-site/build.mjs
        env:
          SITE_URL: ${{ vars.CLOUDFLARE_SITE_URL || 'https://calcforge-kowshik3383.pages.dev' }}

      - name: Create Cloudflare Pages project
        if: inputs.create_project
        run: npx --yes wrangler@4.164.0 pages project create calcforge-kowshik3383 --production-branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4.164.0 pages deploy static-site/dist --project-name=calcforge-kowshik3383 --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
